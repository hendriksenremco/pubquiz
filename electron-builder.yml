appId: app.quiznote
productName: QuizNote
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!fixtures/*'
  - '!scripts/*'
  - '!{test-results,playwright-report,dist}/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,playwright.config.ts}'
  - '!{.eslintcache,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - 'resources/**'
# De rondleiding (pnpm tour:build), in het Nederlands en het Engels; de app zet hem bij de eerste
# start in zijn eigen taal op het dashboard.
extraResources:
  - from: dist/tour/Rondleiding.pubquiz
    to: Rondleiding.pubquiz
  - from: dist/tour/Tour.pubquiz
    to: Tour.pubquiz
fileAssociations:
  - ext: pubquiz
    name: QuizNote-quiz
    description: QuizNote-quiz
    role: Editor
    isPackage: true
  # Rondebestanden (issue #99): dubbelklikken importeert de ronde in de open quiz.
  - ext: quiznoteronde
    name: QuizNote-ronde
    description: Rondebestand van QuizNote
    role: Viewer
mac:
  target:
    - dmg
  category: public.app-category.entertainment
  entitlementsInherit: build/entitlements.mac.plist
  identity: null
  notarize: false
  # Lokaal netwerk: de MagicHome-controller, de afstandsbediening en AirPlay-schermen zoeken (dns-sd).
  extendInfo:
    NSLocalNetworkUsageDescription: QuizNote gebruikt je netwerk voor de afstandsbediening, het licht en AirPlay-schermen.
    NSBonjourServices:
      - _airplay._tcp
dmg:
  artifactName: QuizNote-${version}.${ext}
npmRebuild: false
