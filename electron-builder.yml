appId: com.gutsgusto.pubquiz
productName: Quizmeister
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!fixtures/*'
  - '!scripts/*'
  - '!{test-results,playwright-report,dist}/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,playwright.config.ts}'
  - '!{.eslintcache,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - 'resources/**'
# De rondleiding (pnpm tour:build); de app zet hem bij de eerste start op het dashboard.
extraResources:
  - from: dist/tour/Rondleiding.pubquiz
    to: Rondleiding.pubquiz
fileAssociations:
  - ext: pubquiz
    name: Quizmeister-quiz
    description: Quizmeister-quiz
    role: Editor
    isPackage: true
mac:
  target:
    - dmg
  category: public.app-category.entertainment
  entitlementsInherit: build/entitlements.mac.plist
  identity: null
  notarize: false
dmg:
  artifactName: Quizmeister-${version}.${ext}
npmRebuild: false
