# Maakt een release: bouwt QuizNote op macOS, signeert met de Developer ID van Remco,
# notariseert bij Apple en zet de dmg op GitHub Releases.
# Start met een tag (git tag v0.2.0 && git push origin v0.2.0) of met de hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      # Geen geheimen: de Key ID en de Issuer ID van de App Store Connect API-sleutel "QuizNote notarization".
      APPLE_API_KEY_ID: 35G8C4Q54X
      APPLE_API_ISSUER: 3973c4a8-a91e-450e-a9d3-acf77f12cbcd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Volledige ffmpeg: de rondleiding gebruikt het filter drawtext.
      - name: ffmpeg
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tour:build

      # Eigen sleutelhanger met het certificaat. De tijdelijke sleutelhanger van electron-builder
      # werkt niet op de nieuwste macOS-runners (SecKeychainUnlock faalt).
      - name: Certificaat in de sleutelhanger
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Bouwen, signeren en notariseren
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          npx electron-builder --mac --universal --config electron-builder.release.yml --publish never

      - name: Controleren
        run: |
          APP="$(ls -d dist/mac-universal/QuizNote.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv "$APP"
          xcrun stapler validate dist/QuizNote.dmg || true

      - name: Release op GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # De notities komen uit het deel van CHANGELOG.md bij deze versie.
          {
            echo "QuizNote $VERSION voor macOS (Apple Silicon en Intel)."
            echo
            awk -v v="${VERSION#v}" '$0 ~ "^## " { if (inside) exit; inside = index($0, "## " v " ") == 1 || $0 == "## " v; next } inside' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "QuizNote $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$VERSION" dist/QuizNote.dmg dist/QuizNote-*-mac.zip dist/latest-mac.yml --clobber

  # Na de release: de screenshots voor quiznote.app opnieuw maken (de rondleiding en de quiz die de
  # AI maakt), als site-screens.zip bij de release zetten en de site laten weten dat hij moet bijwerken.
  # De site haalt de zip op en zet de screenshots en het versienummer live (app-release.yml daar).
  site:
    name: Screenshots voor de site
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: ffmpeg
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/make-demo.mjs && pnpm tour && npx electron-vite build
      - run: npx playwright test e2e/tour.spec.ts e2e/site-shots.spec.ts e2e/ai.spec.ts

      - name: Screenshots bij de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          mkdir site-screens
          cp test-results/site-*.png test-results/ai-music-round*.png site-screens/
          (cd site-screens && zip -q ../site-screens.zip *.png)
          gh release upload "$VERSION" site-screens.zip --clobber

      # Een fine-grained token met alleen Contents: read and write op pubquiz-site.
      - name: De site laten bijwerken
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Geen SITE_DISPATCH_TOKEN: start app-release.yml in pubquiz-site met de hand (versie $VERSION)."
            exit 0
          fi
          gh api repos/hendriksenremco/pubquiz-site/dispatches \
            -f event_type=app-release -f "client_payload[version]=$VERSION"
