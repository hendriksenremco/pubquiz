# Instellingen voor een echte release: gesigneerd met de Developer ID van Remco en genotariseerd.
# Gebruikt door .github/workflows/release.yml. Lokaal blijft `pnpm build:mac` ongesigneerd.
extends: ./electron-builder.yml
mac:
  target:
    - dmg
    - zip
  category: public.app-category.entertainment
  identity: Remco Hendriksen
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Geldt voor de zip (voor updates); de dmg krijgt hieronder een vaste naam.
  artifactName: QuizNote-${version}-mac.${ext}
# Automatische updates (issue #46): de app leest app-update.yml en haalt latest-mac.yml en de zip
# van GitHub Releases. Uploaden doet release.yml zelf (--publish never).
publish:
  provider: github
  owner: hendriksenremco
  repo: pubquiz
# Vaste naam, zodat de site altijd naar .../releases/latest/download/QuizNote.dmg kan linken.
dmg:
  artifactName: QuizNote.${ext}
